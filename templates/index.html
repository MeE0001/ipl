<!DOCTYPE html>
<html>

<head>
<title>IPL Auction</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h1>🏏 IPL Auction Dashboard</h1>

<div class="container">

<div class="search-box">
<input id="search" placeholder="Search country">
<button onclick="search()">Search</button>
</div>

<div id="players">

{% for p in players %}

<div class="player-card">

<h3>{{ p.name }}</h3>

<p>Country: {{ p.country }}</p>
<p>Role: {{ p.role }}</p>
<p>Current Bid: ₹{{ p.current_bid }}</p>

<a href="/player/{{ p.player_id }}">
<button>Join Auction</button>
</a>

</div>

{% endfor %}

</div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
